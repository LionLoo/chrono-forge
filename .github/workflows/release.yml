name: Release Windows artifact

on:
  push:
    tags: ['v*']

permissions:
  actions: read
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    environment: release
    steps:
      - name: Check out exact tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Verify tag and manifest versions
        shell: pwsh
        run: |
          node scripts/verify-release-version.mjs $env:GITHUB_REF_NAME
          if ($LASTEXITCODE -ne 0) { throw 'Release version verification failed.' }
          $tagCommit = (git rev-list -n 1 $env:GITHUB_REF_NAME).Trim()
          if ($tagCommit -ne $env:GITHUB_SHA) {
            throw "Tag $env:GITHUB_REF_NAME resolves to $tagCommit instead of workflow commit $env:GITHUB_SHA."
          }
      - name: Require exact green main CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run verify:release-ci
      - name: Set up pinned Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action
        with:
          toolchain: 1.97.1
          targets: x86_64-pc-windows-msvc
          components: clippy,rustfmt
      - name: Cache Rust build
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri -> target
      - name: Install locked dependencies
        run: npm ci
      - name: Build exact release artifacts
        run: npm run build:release
      - name: Verify production excludes the test harness
        run: node tests/e2e-desktop/verify-production-exclusion.mjs
      - name: Generate checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem -LiteralPath 'src-tauri/target/release/bundle/nsis' -Filter '*.exe' -File
          if ($installer.Count -ne 1) { throw "Expected exactly one NSIS installer, found $($installer.Count)." }
          $hash = Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256
          "$($hash.Hash.ToLowerInvariant())  $($installer.Name)" | Set-Content -LiteralPath "$($installer.FullName).sha256" -Encoding utf8NoBOM
      - name: Create or refresh draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $tag = $env:GITHUB_REF_NAME
          $installers = @(Get-ChildItem -LiteralPath 'src-tauri/target/release/bundle/nsis' -Filter '*.exe' -File)
          if ($installers.Count -ne 1) { throw "Expected exactly one NSIS installer, found $($installers.Count)." }
          $installer = $installers[0]
          $checksum = Get-Item -LiteralPath "$($installer.FullName).sha256"
          $sbom = Get-Item -LiteralPath 'release-artifacts/chrono-forge.cdx.json'
          $manifest = Get-Item -LiteralPath 'release-artifacts/release-manifest.json'
          $assets = @($installer.FullName, $checksum.FullName, $sbom.FullName, $manifest.FullName)
          $expectedNames = @($installer.Name, $checksum.Name, $sbom.Name, $manifest.Name) | Sort-Object

          $existingJson = gh release view $tag --json isDraft,assets 2>$null
          $viewExit = $LASTEXITCODE
          if ($viewExit -eq 0) {
            $existing = $existingJson | ConvertFrom-Json
            if (-not $existing.isDraft) {
              throw "Release $tag is already published; refusing to mutate it on a rerun."
            }
            foreach ($asset in @($existing.assets)) {
              if ($expectedNames -notcontains $asset.name) {
                gh release delete-asset $tag $asset.name --yes
                if ($LASTEXITCODE -ne 0) { throw "Could not remove unexpected draft asset $($asset.name)." }
              }
            }
            gh release edit $tag --title "Chrono Forge $tag" --notes-file RELEASE_NOTES.md --draft
            if ($LASTEXITCODE -ne 0) { throw "Could not refresh draft metadata for $tag." }
            gh release upload $tag $assets --clobber
            if ($LASTEXITCODE -ne 0) { throw "Could not refresh draft assets for $tag." }
          } else {
            gh release create $tag $assets --verify-tag --title "Chrono Forge $tag" --notes-file RELEASE_NOTES.md --draft
            if ($LASTEXITCODE -ne 0) { throw "Could not create draft release $tag." }
          }

          $draft = gh release view $tag --json isDraft,assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $draft.isDraft) { throw "Release $tag is not a readable draft." }
          $actualNames = @($draft.assets | ForEach-Object { $_.name }) | Sort-Object
          if (($actualNames -join "`n") -ne ($expectedNames -join "`n")) {
            throw "Draft assets do not match the exact release contract: $($actualNames -join ', ')."
          }
      - name: Download exact draft assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $downloadDirectory = Join-Path $env:GITHUB_WORKSPACE 'test-results/release-download'
          if (Test-Path -LiteralPath $downloadDirectory) { throw "Download directory already exists: $downloadDirectory" }
          New-Item -ItemType Directory -Path $downloadDirectory | Out-Null
          gh release download $env:GITHUB_REF_NAME --dir $downloadDirectory
          if ($LASTEXITCODE -ne 0) { throw 'Draft release download failed.' }
      - name: Verify and stage downloaded assets
        run: npm run stage:downloaded-release -- test-results/release-download test-results/release-staged
      # GitHub-hosted Windows runs the job at high integrity. Current WebView2 intentionally
      # ignores inherited and HKCU overrides for elevated hosts, so use temporary per-executable
      # HKLM policies for both the bounded diagnostics port and isolated data directory.
      - name: Configure installed WebView2 diagnostics policy
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $argumentsKey = 'HKLM:\Software\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments'
          $dataFolderKey = 'HKLM:\Software\Policies\Microsoft\Edge\WebView2\UserDataFolder'
          $expectedArguments = '--remote-debugging-port=9222'
          $expectedDataFolder = Join-Path $env:RUNNER_TEMP 'chrono-forge-release-webview2'
          New-Item -Path $argumentsKey -Force | Out-Null
          New-Item -Path $dataFolderKey -Force | Out-Null
          New-ItemProperty -Path $argumentsKey -Name 'chrono-forge.exe' -PropertyType String -Value $expectedArguments -Force | Out-Null
          New-ItemProperty -Path $dataFolderKey -Name 'chrono-forge.exe' -PropertyType String -Value $expectedDataFolder -Force | Out-Null
          if ((Get-ItemPropertyValue -LiteralPath $argumentsKey -Name 'chrono-forge.exe') -ne $expectedArguments) {
            throw 'Installed WebView2 diagnostics argument policy was not configured exactly.'
          }
          if ((Get-ItemPropertyValue -LiteralPath $dataFolderKey -Name 'chrono-forge.exe') -ne $expectedDataFolder) {
            throw 'Installed WebView2 data-folder policy was not configured exactly.'
          }
      - name: Smoke downloaded installer
        env:
          CHRONO_FORGE_RC_ARTIFACT_ROOT: test-results/release-staged
          CHRONO_FORGE_RC_CDP_PORT: '9222'
          CHRONO_FORGE_RC_OUTPUT: test-results/release-download-smoke
          WEBVIEW2_USER_DATA_FOLDER: ${{ runner.temp }}\chrono-forge-release-webview2
        run: npm run verify:installed-release-candidate
      - name: Remove installed WebView2 diagnostics policy
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $keys = @(
            'HKLM:\Software\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments',
            'HKLM:\Software\Policies\Microsoft\Edge\WebView2\UserDataFolder'
          )
          foreach ($key in $keys) {
            if (Test-Path -LiteralPath $key) {
              $properties = Get-ItemProperty -LiteralPath $key
              if ($properties.PSObject.Properties.Name -contains 'chrono-forge.exe') {
                Remove-ItemProperty -LiteralPath $key -Name 'chrono-forge.exe' -ErrorAction Stop
              }
              $properties = Get-ItemProperty -LiteralPath $key
              if ($properties.PSObject.Properties.Name -contains 'chrono-forge.exe') {
                throw "Installed WebView2 diagnostics policy cleanup left chrono-forge.exe under $key."
              }
            }
          }
      - name: Upload downloaded-release smoke evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ github.ref_name }}-downloaded-release-smoke
          path: test-results/release-download-smoke
          if-no-files-found: ignore
          retention-days: 30
      - name: Reconfirm exact green main CI before publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run verify:release-ci
      - name: Publish verified release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $release = gh release view $env:GITHUB_REF_NAME --json isDraft | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $release.isDraft) {
            throw 'Verified release is not an unpublished draft.'
          }
          gh release edit $env:GITHUB_REF_NAME --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Verified release could not be published.' }
