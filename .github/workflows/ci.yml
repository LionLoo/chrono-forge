name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-quality-test:
    name: Web quality, tests, and E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run web gate
        run: npm run ci:web
      - name: Run browser E2E
        run: npm run test:e2e:web
      - name: Upload browser report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 7

  windows-native:
    name: Windows native tests and installer
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Set up pinned Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action
        with:
          toolchain: 1.97.1
          targets: x86_64-pc-windows-msvc
          components: clippy,rustfmt
      - name: Cache Rust build
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri -> target
      - name: Install locked dependencies
        run: npm ci
      - name: Check Rust formatting
        run: npm run format:check:rust
      - name: Lint Rust
        run: npm run lint:rust
      - name: Test Rust
        run: npm run test:rust
      - name: Build Windows installer
        run: npm run build:desktop
      - name: Upload unsigned Windows installer
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: chrono-forge-windows-x64-unsigned
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7

  required:
    name: Required
    if: always()
    needs: [web-quality-test, windows-native]
    runs-on: ubuntu-latest
    steps:
      - name: Confirm required jobs passed
        env:
          WEB_RESULT: ${{ needs.web-quality-test.result }}
          NATIVE_RESULT: ${{ needs.windows-native.result }}
        run: test "$WEB_RESULT" = success -a "$NATIVE_RESULT" = success
