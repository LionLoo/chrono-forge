[package]
name = "chrono-forge"
version = "1.0.0"
description = "Chrono Forge desktop shell"
authors = ["Chrono Forge contributors"]
edition = "2024"
rust-version = "1.97.1"
license = "MIT"

[lib]
name = "chrono_forge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
desktop-e2e = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
rusqlite = { version = "=0.40.2", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-notification = "=2.3.3"
tauri-plugin-wdio = { version = "=1.3.0", optional = true }
tauri-plugin-wdio-webdriver = { version = "=1.3.0", optional = true }
